services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: overlang_backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=overlang
      - DB_USERNAME=overlang
      - DB_PASSWORD=overlang1234
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WORKER_SECRET=overlang-worker-secret
    depends_on:
      - postgres
      - redis

  ai:
    profiles: ["gpu-only"] # GPU가 있는 경우에만 실행 (--profile gpu-only)
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: overlang_ai
    volumes:
      - ./ai:/app/ai
    env_file:
      - ./ai/.env
    environment:
      - PYTHONPATH=/app
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8000:8000"
    command: uvicorn ai.api.app:app --host 0.0.0.0 --port 8000

  ai-worker:
    profiles: ["gpu-only"]
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: overlang_ai_worker
    volumes:
      - ./ai:/app/ai
    env_file:
      - ./ai/.env
    environment:
      - PYTHONPATH=/app
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - redis
      - ai
    command: celery -A ai.worker.celery_app worker --loglevel=info --pool=solo

  ai-queue-consumer:
    profiles: ["gpu-only"]
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: overlang_ai_queue_consumer
    volumes:
      - ./ai:/app/ai
    env_file:
      - ./ai/.env
    environment:
      - PYTHONPATH=/app
    depends_on:
      - redis
      - ai-worker
    command: python -m ai.worker.job_queue_consumer

  # Database & Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    container_name: overlang_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: overlang
      POSTGRES_USER: overlang
      POSTGRES_PASSWORD: overlang1234
    volumes:
      - overlang_pgdata:/var/lib/postgresql/data

volumes:
  overlang_pgdata:
